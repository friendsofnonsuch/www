<header class="bg-primary">
	<nav x-data="{open: true}" class="mx-auto flex max-w-7xl items-center justify-between p-6 lg:px-8" aria-label="Global">
		<div class="flex lg:flex-1">
			<a href="/" class="-m-1.5 p-1.5">
				<span class="sr-only">Friends of Nonsuch</span>

				<img class="h-8 w-auto" src="https://tailwindcss.com/plus-assets/img/logos/mark.svg?color=indigo&shade=600" alt="">
			</a>
		</div>

		<!-- hamburger menu -->
		<div class="flex lg:hidden">
			<button @click="open=!open" type="button" class="-m-2.5 inline-flex items-center justify-center rounded-md p-2.5 text-white">
				<span class="sr-only">Open main menu</span>

				<svg x-show="open" class="size-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true" data-slot="icon">
					<path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
				</svg>
			</button>
		</div>

		<!-- desktop menu -->
		<div class="hidden lg:flex lg:gap-x-6">
			{% for menu in menus %}
				{%- include 'menuItem.html', media: 'desktop' %}
			{% endfor -%}
		</div>

		<!-- Mobile menu, show/hide based on menu open state. -->
		<div x-show="!open" class="lg:hidden" role="dialog" aria-modal="true">
			<!-- Background backdrop, show/hide based on slide-over state. -->
			<div class="fixed inset-0 z-10"></div>

			<div class="fixed inset-y-0 right-0 z-10 w-full overflow-y-auto bg-primary px-6 py-6 sm:max-w-sm sm:ring-1 sm:ring-gray-900/10">
				<div class="flex items-center justify-between">
					<a href="#" class="-m-1.5 p-1.5">
						<span class="sr-only">Friends of Nonsuch</span>
						<img class="h-8 w-auto" src="https://tailwindcss.com/plus-assets/img/logos/mark.svg?color=indigo&shade=600" alt="">
					</a>

					<button @click="open = !open" type="button" class="-m-2.5 rounded-md p-2.5 text-white">
						<span class="sr-only">Close menu</span>

						<svg x-show="!open" class="size-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true" data-slot="icon">
							<path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
						</svg>
					</button>
				</div>

				<div class="mt-6 flow-root">
					<div class="">
						{% for menu in menus %}
							{%- include 'menuItem.html', media: 'mobile' %}
						{% endfor -%}
					</div>
				</div>
			</div>
		</div>
	</nav>
</header>
