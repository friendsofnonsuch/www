<!DOCTYPE html>
<html class="h-full bg-yellow-50" lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Friends of Nonsuch</title>
	<link href="/styles/tailwind.css" rel="stylesheet">
	<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
</head>

<body class="h-full">
<div class="min-h-full">
	<div class="bg-primary pb-32">
		{% include 'menubar.html' %}

		<header class="py-10">
			<div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
				<h1 class="text-3xl font-bold tracking-tight text-white">{{ title }}</h1>
			</div>
		</header>
	</div>

	<main class="-mt-32">
		<div class="mx-auto max-w-7xl px-4 pb-12 sm:px-6 lg:px-8">
			<div class="rounded-lg bg-white px-5 py-6 shadow sm:px-6">
				{{ content }}

				<div class="mt-12 border-t border-primary/20 pt-8 md:flex md:items-center md:justify-between">
					<div class="flex gap-x-6 md:order-2">
						<a href="https://www.facebook.com/FriendsofNonsuch/" target="_blank" class="text-gray-600 hover:text-gray-800">
							<span class="sr-only">Facebook</span>

							<svg class="size-6" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
								<path fill-rule="evenodd" d="M22 12c0-5.523-4.477-10-10-10S2 6.477 2 12c0 4.991 3.657 9.128 8.438 9.878v-6.987h-2.54V12h2.54V9.797c0-2.506 1.492-3.89 3.777-3.89 1.094 0 2.238.195 2.238.195v2.46h-1.26c-1.243 0-1.63.771-1.63 1.562V12h2.773l-.443 2.89h-2.33v6.988C18.343 21.128 22 16.991 22 12z" clip-rule="evenodd" />
							</svg>
						</a>

						<a href="https://x.com/FoNonsuch" target="_blank" class="text-gray-600 hover:text-gray-800">
							<span class="sr-only">X</span>

							<svg class="size-6" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
								<path d="M13.6823 10.6218L20.2391 3H18.6854L12.9921 9.61788L8.44486 3H3.2002L10.0765 13.0074L3.2002 21H4.75404L10.7663 14.0113L15.5685 21H20.8131L13.6819 10.6218H13.6823ZM11.5541 13.0956L10.8574 12.0991L5.31391 4.16971H7.70053L12.1742 10.5689L12.8709 11.5655L18.6861 19.8835H16.2995L11.5541 13.096V13.0956Z" />
							</svg>
						</a>
					</div>

					<p class="mt-8 text-sm/6 text-gray-600 md:order-1 md:mt-0">&copy; {% year %} The Friends of Nonsuch (<a href="https://register-of-charities.charitycommission.gov.uk/en/charity-search/-/charity-details/1053923" target="_blank" rel="noopener noreferrer">registered charity number: 1053923</a>). All rights reserved.</p>
				</div>

				<p class="mt-8 text-sm/6 text-gray-600 md:order-1 md:mt-0">
					Page last updated: <script>document.write( new Date( "{{ page.date }}" ).toLocaleString( 'en-GB', { 'weekday': 'long', 'month': 'long', 'year': 'numeric', 'day': 'numeric', 'hour': 'numeric', 'minute': 'numeric', 'hour12': true } ) );</script>
			</div>
		</div>
	</main>
</div>
</body>
</html>
